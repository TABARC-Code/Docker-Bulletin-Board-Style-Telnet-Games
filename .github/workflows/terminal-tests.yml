name: Terminal game checks

on:
  push:
  pull_request:

jobs:
  shell-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shell and regression checks
        run: make test

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect game images
        run: make test-containers

  pinball-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Pinball physics and terminal quit
        run: |
          bash -n Pinball/pinball.sh
          bash tests/pinball-physics.sh
          bash tests/pinball-terminal.sh

  worm-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Worm movement and terminal quit
        run: |
          bash -n worm/worm.sh
          bash tests/worm-gameplay.sh
          bash tests/worm-terminal.sh
